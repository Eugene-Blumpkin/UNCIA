<title>UNCIA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap">

<style>
  :root{
    --void:#050505;
    --panel:#0F0F0F;
    --panel-2:#141414;
    --line:#262626;
    --line-2:#1a1a1a;
    --paper:#EAEAEA;
    --dim:#6E6E6E;
    --dim-2:#4A4A4A;
    --signal:#FFFFFF;
    --font-display:'Archivo Black', Georgia, serif;
    --font-mono:'Space Mono', 'Courier New', monospace;
    --font-body:'Inter', system-ui, sans-serif;
  }

  *{ box-sizing:border-box; }
  body{
    margin:0;
    background:var(--void);
    color:var(--paper);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--signal); color:var(--void); }
  a{ color:inherit; }
  button{ font-family:inherit; }
  input, select, textarea{ color-scheme:dark; font-family:inherit; }
  input::placeholder{ color:var(--dim); }
  :focus-visible{ outline:1px solid var(--signal); outline-offset:2px; }
  @media (prefers-reduced-motion: no-preference){
    .row, .chip, .badge, .cta, .navlink{ transition:background-color .12s ease, color .12s ease, border-color .12s ease, opacity .12s ease; }
  }

  .wrap{ max-width:860px; margin:0 auto; padding:0 20px 80px; }

  /* Header */
  .header{
    border-bottom:1px solid var(--line);
    display:flex; align-items:flex-end; justify-content:space-between;
    flex-wrap:wrap; gap:16px; padding:28px 0 20px;
  }
  .brand-name{ font-family:var(--font-display); font-size:26px; letter-spacing:.5px; }
  .brand-tag{ font-family:var(--font-mono); font-size:11px; letter-spacing:.18em; color:var(--dim); margin-top:6px; text-transform:uppercase; }
  .cta{
    font-family:var(--font-mono); font-size:12px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--void); background:var(--signal); border:none; padding:11px 18px; cursor:pointer;
  }
  .cta:hover{ opacity:.85; }

  /* Hero */
  .hero{
    display:flex; align-items:center; gap:36px; padding:32px 0 8px;
    border-bottom:1px solid var(--line); flex-wrap:wrap;
  }
  .hero-mark{ flex:1 1 260px; margin-left:-16px; max-width:380px; }
  .hero-mark svg{ display:block; width:100%; height:auto; }
  .hero-stats{ flex:1 1 220px; display:flex; flex-direction:column; }
  .hero-stat{ padding:13px 0; border-top:1px solid var(--line); }
  .hero-stat:first-child{ border-top:none; }
  .hero-stat .num{ font-family:var(--font-mono); font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; }
  .hero-stat .label{ font-size:12px; color:var(--dim); margin-top:2px; }

  /* Nav */
  .nav{ display:flex; gap:26px; padding:16px 0; overflow-x:auto; }
  .navlink{
    background:none; border:none; white-space:nowrap;
    border-bottom:2px solid transparent; color:var(--dim);
    font-family:var(--font-mono); font-size:12px; letter-spacing:.12em; text-transform:uppercase;
    padding-bottom:12px; cursor:pointer;
  }
  .navlink:hover{ color:var(--paper); }
  .navlink.active{ color:var(--paper); border-bottom-color:var(--paper); }

  .section-note{ font-size:12px; color:var(--dim); margin:2px 0 14px; line-height:1.5; }

  /* Filter chips */
  .chips{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  .chip{
    font-family:var(--font-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase;
    background:none; border:1px solid var(--line); color:var(--dim); padding:7px 11px; cursor:pointer;
  }
  .chip:hover{ border-color:var(--dim); color:var(--paper); }
  .chip.active{ background:var(--signal); border-color:var(--signal); color:var(--void); }

  /* Rows (trails / events / perks) */
  .row{
    display:flex; align-items:center; gap:14px; padding:14px 4px;
    border-top:1px solid var(--line);
  }
  .row-list{ border-bottom:1px solid var(--line); }
  .row:hover{ background:var(--panel); }
  .row-idx{ font-family:var(--font-mono); font-size:12px; color:var(--dim); width:22px; flex-shrink:0; font-variant-numeric:tabular-nums; }
  .row-dot{ width:7px; height:7px; border-radius:50%; border:1px solid var(--paper); background:transparent; flex-shrink:0; }
  .row-dot.on{ background:var(--paper); }
  .row-main{ flex:1 1 auto; min-width:0; }
  .row-name{ font-size:14px; font-weight:500; color:var(--dim); }
  .row-name.on{ color:var(--paper); }
  .tag-rare{ font-family:var(--font-mono); font-size:10px; color:var(--dim); margin-left:8px; letter-spacing:.08em; }
  .row-sub{ font-size:12px; color:var(--dim); font-weight:400; }
  .row-meta{
    font-family:var(--font-mono); font-size:12px; color:var(--dim);
    text-align:right; white-space:nowrap; flex-shrink:0;
  }
  .row-btn{
    background:none; border:1px solid var(--line); color:var(--dim);
    font-family:var(--font-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase;
    padding:7px 12px; cursor:pointer; white-space:nowrap; flex-shrink:0;
  }
  .row-btn:hover:not(:disabled){ border-color:var(--paper); color:var(--paper); }
  .row-btn.on{ border-color:var(--paper); color:var(--paper); }
  .row-btn:disabled{ color:var(--dim-2); border-color:var(--line-2); cursor:not-allowed; }
  .row-btn.plain{ border:none; padding:6px 0; }
  .row-btn.plain:hover{ color:var(--paper); }

  @media (max-width:560px){
    .row{ flex-wrap:wrap; }
    .row-meta{ width:100%; text-align:left; padding-left:36px; margin-top:-4px; }
  }

  /* Profile */
  .stat-strip{ display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line); margin-bottom:28px; }
  .stat-strip div{ background:var(--void); padding:14px 12px; }
  .stat-strip .num{ font-family:var(--font-mono); font-size:18px; font-weight:700; font-variant-numeric:tabular-nums; }
  .stat-strip .label{ font-size:11px; color:var(--dim); margin-top:2px; }
  @media (max-width:560px){ .stat-strip{ grid-template-columns:repeat(2,1fr); } }

  .subhead{ font-family:var(--font-mono); font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.12em; margin:0 0 10px; }

  .badge-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--line); margin-bottom:32px; }
  .badge{ background:var(--void); padding:16px 14px; }
  .badge-dot{ width:7px; height:7px; border-radius:50%; border:1px solid var(--paper); background:transparent; margin-bottom:10px; }
  .badge-dot.on{ background:var(--paper); }
  .badge-name{ font-size:13px; font-weight:600; color:var(--dim); }
  .badge-name.on{ color:var(--paper); }
  .badge-desc{ font-size:11px; color:var(--dim); margin-top:4px; line-height:1.4; }
  @media (max-width:560px){ .badge-grid{ grid-template-columns:repeat(2,1fr); } }

  .empty{ font-size:13px; color:var(--dim); padding:20px 4px; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }

  /* Modal */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,.75);
    display:flex; align-items:center; justify-content:center; padding:20px; z-index:50;
  }
  .modal{ background:var(--panel); border:1px solid var(--line); padding:24px; width:100%; max-width:380px; }
  .modal-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
  .modal-title{ font-family:var(--font-display); font-size:15px; }
  .modal-close{ background:none; border:none; color:var(--dim); font-size:20px; cursor:pointer; line-height:1; padding:0; }
  .modal-close:hover{ color:var(--paper); }
  .field{ margin-bottom:14px; }
  .field-label{ font-family:var(--font-mono); font-size:10px; color:var(--dim); margin-bottom:6px; text-transform:uppercase; letter-spacing:.1em; }
  .field input, .field select{
    width:100%; background:#000; border:1px solid var(--line); padding:9px 10px;
    color:var(--paper); font-size:14px; outline:none;
  }
  .modal-submit{
    margin-top:6px; width:100%; background:var(--signal); color:var(--void); border:none;
    padding:13px 0; font-family:var(--font-mono); font-size:12px; letter-spacing:.1em;
    text-transform:uppercase; cursor:pointer;
  }
  .modal-submit:hover{ opacity:.85; }

  .footer{ margin-top:40px; padding-top:20px; border-top:1px solid var(--line); font-family:var(--font-mono); font-size:11px; color:var(--dim-2); letter-spacing:.04em; }
</style>

  function markSVG(){
    return '<svg viewBox="0 0 736 490" role="img" aria-label="UNCIA skeleton mark"><path d="'+MARK_PATH+'" fill="var(--paper)" fill-rule="evenodd"/></svg>';
  }

  function renderHeader(){
    return (
      '<div class="header">' +
        '<div>' +
          '<div class="brand-name">UNCIA</div>' +
          '<div class="brand-tag">Field manifest &middot; Almaty, KZ</div>' +
        '</div>' +
        '<button class="cta" data-action="open-add">+ Log a trail</button>' +
      '</div>'
    );
  }

  function renderHero(s){
    var rows = [
      [pad2(s.exploredIds.size) + " / " + TRAILS.length, "trails catalogued"],
      [s.totalKm + "km", "ground covered"],
      [s.totalGain.toLocaleString() + "m", "climbed"],
      [String(s.rareExplored.length), "rare catch" + (s.rareExplored.length!==1 ? "es" : "")]
    ];
    var statsHtml = rows.map(function(r){
      return '<div class="hero-stat"><div class="num">'+esc(r[0])+'</div><div class="label">'+esc(r[1])+'</div></div>';
    }).join("");
    return (
      '<div class="hero">' +
        '<div class="hero-mark">'+markSVG()+'</div>' +
        '<div class="hero-stats">'+statsHtml+'</div>' +
      '</div>'
    );
  }

  function renderNav(){
    var tabs = [["explore","Explore"], ["events","Events"], ["perks","Perks"], ["profile","Profile"]];
    return '<div class="nav">' + tabs.map(function(t){
      return '<button class="navlink'+(state.tab===t[0]?' active':'')+'" data-action="tab" data-tab="'+t[0]+'">'+t[1]+'</button>';
    }).join("") + '</div>';
  }

  function renderExplore(s){
    var diffs = ["all","Easy","Moderate","Strenuous"];
    var chips = diffs.map(function(d){
      var label = d==="all" ? "All" : d;
      return '<button class="chip'+(state.difficulty===d?' active':'')+'" data-action="filter-difficulty" data-value="'+d+'">'+esc(label)+'</button>';
    }).join("");

    var filtered = TRAILS.filter(function(t){ return state.difficulty==="all" || difficulty(t)===state.difficulty; });

    var rowsHtml = filtered.map(function(t, i){
      var got = s.exploredIds.has(t.id);
      var rareTag = t.rare ? '<span class="tag-rare">RARE</span>' : '';
      return (
        '<div class="row">' +
          '<span class="row-idx">'+pad2(i+1)+'</span>' +
          '<span class="row-dot'+(got?' on':'')+'"></span>' +
          '<span class="row-main"><span class="row-name'+(got?' on':'')+'">'+esc(t.name)+rareTag+'</span></span>' +
          '<span class="row-meta">'+esc(t.cat)+' &middot; '+t.km+'km &middot; +'+t.gain+'m &middot; '+difficulty(t)+'</span>' +
        '</div>'
      );
    }).join("");

    if(!filtered.length){
      rowsHtml = '<div class="empty">No trails at this difficulty.</div>';
    }

    return (
      '<div class="chips">'+chips+'</div>' +
      '<div class="row-list">'+rowsHtml+'</div>'
    );
  }

  function renderEvents(){
    var rowsHtml = EVENTS.map(function(e, i){
      var interested = state.interested.has(e.id);
      return (
        '<div class="row">' +
          '<span class="row-idx">'+pad2(i+1)+'</span>' +
          '<span class="row-main"><span class="row-name on">'+esc(e.title)+'</span><span class="row-sub"> &middot; '+esc(e.organizer)+'</span></span>' +
          '<span class="row-meta">'+esc(e.type)+' &middot; '+esc(e.when)+'</span>' +
          '<button class="row-btn'+(interested?' on':'')+'" data-action="toggle-interested" data-id="'+e.id+'">'+(interested?"Interested ✓":"Interested")+'</button>' +
        '</div>'
      );
    }).join("");

    return (
      '<div class="section-note">Curated from local clubs and operators &mdash; not a live feed in this demo.</div>' +
      '<div class="row-list">'+rowsHtml+'</div>'
    );
  }

  function renderPerks(s){
    var rowsHtml = PERKS.map(function(p){
      var unlocked = perkUnlocked(p.unlock, s);
      return (
        '<div class="row">' +
          '<span class="row-dot'+(unlocked?' on':'')+'"></span>' +
          '<span class="row-main">' +
            '<div class="row-name'+(unlocked?' on':'')+'" style="font-size:14px">'+esc(p.biz)+'</div>' +
            '<div class="row-sub" style="margin-top:2px">'+esc(p.offer)+' &middot; '+(unlocked?"unlocked":esc(UNLOCK_LABEL[p.unlock]))+'</div>' +
          '</span>' +
          '<button class="row-btn'+(unlocked?'':'')+'" '+(unlocked?'':'disabled')+'>Redeem</button>' +
        '</div>'
      );
    }).join("");

    return (
      '<div class="section-note">Concept mockup &mdash; redemption would run through a partner like Kaspi Pay, not a new payments system.</div>' +
      '<div class="row-list">'+rowsHtml+'</div>'
    );
  }

  function renderProfile(s){
    var badgesHtml = BADGES.map(function(b){
      var on = b.test(s);
      return (
        '<div class="badge">' +
          '<div class="badge-dot'+(on?' on':'')+'"></div>' +
          '<div class="badge-name'+(on?' on':'')+'">'+esc(b.name)+'</div>' +
          '<div class="badge-desc">'+esc(b.desc)+'</div>' +
        '</div>'
      );
    }).join("");

    var sortedLog = state.log.slice().sort(function(a,b){ return a.date < b.date ? 1 : -1; });
    var logHtml = sortedLog.map(function(l, i){
      var t = trailById(l.trail);
      return (
        '<div class="row">' +
          '<span class="row-meta" style="width:90px;text-align:left">'+esc(l.date)+'</span>' +
          '<span class="row-main"><span class="row-name on" style="font-size:14px">'+esc(t?t.name:"Unknown trail")+'</span></span>' +
          '<button class="row-btn plain" data-action="remove-log" data-id="'+l.id+'">Remove</button>' +
        '</div>'
      );
    }).join("");
    if(!sortedLog.length){
      logHtml = '<div class="empty">No entries yet &mdash; log a trail to start your manifest.</div>';
    }

    return (
      '<div class="stat-strip">' +
        '<div><div class="num">'+pad2(s.exploredIds.size)+'/'+TRAILS.length+'</div><div class="label">catalogued</div></div>' +
        '<div><div class="num">'+s.totalKm+'km</div><div class="label">covered</div></div>' +
        '<div><div class="num">'+s.totalGain.toLocaleString()+'m</div><div class="label">climbed</div></div>' +
        '<div><div class="num">'+BADGES.filter(function(b){ return b.test(s); }).length+'/'+BADGES.length+'</div><div class="label">badges</div></div>' +
      '</div>' +
      '<div class="subhead">Badges</div>' +
      '<div class="badge-grid">'+badgesHtml+'</div>' +
      '<div class="subhead">Activity log</div>' +
      '<div class="row-list">'+logHtml+'</div>'
    );
  }

  function renderModal(){
    if(!state.showAdd) return "";
    var options = TRAILS.map(function(t){ return '<option value="'+t.id+'">'+esc(t.name)+' &mdash; '+esc(t.cat)+'</option>'; }).join("");
    return (
      '<div class="modal-backdrop" data-action="close-add">' +
        '<form class="modal" data-action="submit-add">' +
          '<div class="modal-head">' +
            '<div class="modal-title">Log a trail</div>' +
            '<button type="button" class="modal-close" data-action="close-add">&times;</button>' +
          '</div>' +
          '<div class="field">' +
            '<div class="field-label">Date</div>' +
            '<input required type="date" name="date" id="f-date">' +
          '</div>' +
          '<div class="field">' +
            '<div class="field-label">Trail or peak</div>' +
            '<select name="trail" id="f-trail">'+options+'</select>' +
          '</div>' +
          '<div class="field">' +
            '<div class="field-label">Notes (optional)</div>' +
            '<input type="text" name="notes" id="f-notes" placeholder="e.g. with the Saturday club group">' +
          '</div>' +
          '<button type="submit" class="modal-submit">Add to log</button>' +
        '</form>' +
      '</div>'
    );
  }

  function render(){
    var s = computeStats();
    var body = "";
    if(state.tab==="explore") body = renderExplore(s);
    else if(state.tab==="events") body = renderEvents();
    else if(state.tab==="perks") body = renderPerks(s);
    else if(state.tab==="profile") body = renderProfile(s);

    var html = (
      '<div class="wrap">' +
        renderHeader() +
        renderHero(s) +
        renderNav() +
        body +
        '<div class="footer">Almaty first. Astana, Shymkent and the Altai next.</div>' +
      '</div>' +
      renderModal()
    );

    document.getElementById("app").innerHTML = html;

    if(state.showAdd){
      var dateEl = document.getElementById("f-date");
      if(dateEl) dateEl.focus();
    }
  }

  document.getElementById("app").addEventListener("click", function(e){
    var el = e.target.closest("[data-action]");
    if(!el) return;
    var action = el.getAttribute("data-action");

    if(action==="tab"){
      state.tab = el.getAttribute("data-tab");
      render();
    } else if(action==="open-add"){
      state.showAdd = true;
      render();
    } else if(action==="close-add"){
      if(e.target !== el) return;
      state.showAdd = false;
      render();
    } else if(action==="filter-difficulty"){
      state.difficulty = el.getAttribute("data-value");
      render();
    } else if(action==="toggle-interested"){
      var id = el.getAttribute("data-id");
      if(state.interested.has(id)) state.interested.delete(id); else state.interested.add(id);
      saveInterested(state.interested);
      render();
    } else if(action==="remove-log"){
      var lid = el.getAttribute("data-id");
      state.log = state.log.filter(function(l){ return l.id !== lid; });
      saveLog(state.log);
      render();
    }
  });

  document.getElementById("app").addEventListener("submit", function(e){
    var el = e.target.closest('[data-action="submit-add"]');
    if(!el) return;
    e.preventDefault();
    var date = document.getElementById("f-date").value;
    var trail = document.getElementById("f-trail").value;
    var notes = document.getElementById("f-notes").value;
    if(!date) return;
    state.log = [{ id:"l"+Date.now(), date:date, trail:trail, notes:notes }].concat(state.log);
    saveLog(state.log);
    state.showAdd = false;
    state.tab = "profile";
    render();
  });

  document.addEventListener("keydown", function(e){
    if(e.key==="Escape" && state.showAdd){ state.showAdd = false; render(); }
  });

  render();
})();
</script>
